name: skill-ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_skill.py .
      # Run 7 is the currently promoted/reviewed workflow state. Do not pin CI
      # to an obsolete predecessor once a later run has been promoted.
      - run: python scripts/audit_workflow.py docs/RUN7_WORKFLOW_MANIFEST.json
      - run: python scripts/qa_project.py examples/sri_lanka_pre_1948
      - run: python scripts/qa_project.py examples/sri_lanka_post_1948
      # Publish-run smoke test: exercises the actual reader-export pipeline
      # (python-docx generation + retention gate) so a regression there fails
      # CI instead of surfacing only when someone renders manually.
      - run: python scripts/render_full_reader_v3.py --project all
