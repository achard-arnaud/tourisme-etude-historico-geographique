name: skill-ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_skill.py .
      - run: python scripts/qa_project.py examples/sri_lanka_pre_1948
      - run: python scripts/qa_project.py examples/sri_lanka_post_1948
