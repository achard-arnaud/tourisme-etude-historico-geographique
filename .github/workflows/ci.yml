name: skill-ci

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_skill.py .
      - run: python scripts/audit_workflow.py --latest
      - run: python scripts/audit_context_budget.py --latest
      - run: python scripts/audit_intake_lineage.py
      - run: python scripts/audit_run13_contracts.py
      - run: python scripts/audit_run14_legacy.py
      - run: python scripts/audit_run15_intakes.py
      - run: python scripts/audit_run16_intakes.py
      - run: python scripts/audit_run17_kandy.py
      - run: python scripts/audit_run18_tea.py
      - run: python scripts/question_contract.py examples/sri_lanka_pre_1948
      - run: python scripts/question_contract.py examples/sri_lanka_post_1948
      - run: python scripts/qa_project.py examples/sri_lanka_pre_1948
      - run: python scripts/qa_project.py examples/sri_lanka_post_1948
      - run: python scripts/qa_composition_pipeline.py examples/sri_lanka_pre_1948
      - run: python scripts/qa_composition_pipeline.py examples/sri_lanka_post_1948
      - run: python scripts/build_heat_map.py --project examples/sri_lanka_pre_1948 --run 25
      - run: python scripts/reciprocal_coverage_check.py --project examples/sri_lanka_pre_1948 --run 25
      - run: python scripts/materialize_arc_recaps.py --project examples/sri_lanka_pre_1948 --source examples/sri_lanka_pre_1948/09_output/report.md --check
      - run: python scripts/build_drafting_packets.py --project examples/sri_lanka_pre_1948
      - run: python scripts/build_drafting_packets.py --project examples/sri_lanka_post_1948
      - name: Publish shared drafting packets
        uses: actions/upload-artifact@v4
        with:
          name: drafting-packets-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            examples/sri_lanka_pre_1948/09_output/drafting_packets/**
            examples/sri_lanka_post_1948/09_output/drafting_packets/**
      - run: python scripts/qa_functional_pre1948.py
      - run: python scripts/render_composed_reader.py --project all
      - name: Publish complete reader outputs
        uses: actions/upload-artifact@v4
        with:
          name: sri-lanka-complete-reader-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            docs/RUN25_JOURNAL.md
            docs/HEAT_MAP_RUN25.md
            examples/sri_lanka_pre_1948/08_questions/coverage_gaps_run25.json
            examples/sri_lanka_pre_1948/09_output/*.docx
            examples/sri_lanka_pre_1948/09_output/*full*.md
            examples/sri_lanka_pre_1948/09_output/reader_plan.json
            examples/sri_lanka_pre_1948/09_output/story_scaffold.json
            examples/sri_lanka_post_1948/09_output/*.docx
            examples/sri_lanka_post_1948/09_output/*full*.md
            examples/sri_lanka_post_1948/09_output/reader_plan.json
            examples/sri_lanka_post_1948/09_output/story_scaffold.json
